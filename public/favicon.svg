<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Chronicle sigil: the clock alone, hands at 8:30 (hour 255°, 0.52 r;
       minute 180°, 0.78 r), stroke ratio 0.1234 × outer diameter — the
       wordmark's drawn O at 1:1. -->
  <style>
    .op { stroke: #33547D }
    @media (prefers-color-scheme: dark) { .op { stroke: #7CA1D6 } }
  </style>
  <g class="op" fill="none" stroke-width="3.21" stroke-linecap="round">
    <circle cx="16" cy="16" r="11.4"/>
    <line x1="16" y1="16" x2="10.27" y2="17.53"/>
    <line x1="16" y1="16" x2="16" y2="24.89"/>
  </g>
</svg>
