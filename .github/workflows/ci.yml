# The app had no CI while it lived as a subdirectory of the org site repo —
# every check was somebody remembering to run it. Its own repo gets its own
# gate: the same four commands the README tells a developer to run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # vitest: the release-chain verifier against the real committed bytes,
      # citation format, data invariants, and the register's CSS invariants.
      - run: bun run test
      - run: bun run build
